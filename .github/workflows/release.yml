name: Release APK on Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.0.4)'
        required: false
        default: 'v0.0.4'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          else
            echo "No KEYSTORE_BASE64 secret provided; proceeding with unsigned/default build."
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Calculate Version Info
        id: version_info
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ]; then
            RAW_TAG="${{ inputs.tag_name || 'v0.0.4' }}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "version_name=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$(( 100 + ${{ github.run_number }} ))" >> $GITHUB_OUTPUT

      - name: Build Release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          APP_VERSION_NAME: ${{ steps.version_info.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_info.outputs.version_code }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifact
        id: prepare_release
        run: |
          TAG="${{ steps.version_info.outputs.tag }}"
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          RELEASE_NAME="ThingCount-${TAG}.apk"
          cp "$APK_PATH" "$RELEASE_NAME"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "apk_path=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag }}
          name: ThingCount Release ${{ steps.prepare_release.outputs.tag }}
          files: ${{ steps.prepare_release.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
